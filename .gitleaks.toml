title = "keephive"
minVersion = "8.30.1"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Pre-compact redaction tests contain synthetic overlapping token shapes."
condition = "AND"
regexTarget = "line"
paths = ['''^tests/test_precompact\.py$''']
regexes = ['''text\s*=\s*"TOKEN=[^"]+ and also API_KEY=[^"]+"''']

[[rules.allowlists]]
description = "Memory-loop redaction tests contain two synthetic token shapes."
condition = "AND"
regexTarget = "line"
paths = ['''^tests/test_memory_loop\.py$''']
regexes = ['''text\s*=\s*"token: [^"]+ and also app_secret[^"]+"''']

[[rules.allowlists]]
description = "Pre-compact insight redaction tests contain a synthetic token shape."
condition = "AND"
regexTarget = "line"
paths = ['''^tests/test_precompact\.py$''']
regexes = ['''insights=\[\("FACT", "The API uses token=[^"]+ for auth"\)\]''']

[[rules]]
id = "stripe-access-token"

[[rules.allowlists]]
description = "Pre-compact redaction tests contain synthetic overlapping token shapes."
condition = "AND"
regexTarget = "line"
paths = ['''^tests/test_precompact\.py$''']
regexes = ['''text\s*=\s*"TOKEN=[^"]+ and also API_KEY=[^"]+"''']

[[rules.allowlists]]
description = "Pre-compact insight redaction tests contain a synthetic token shape."
condition = "AND"
regexTarget = "line"
paths = ['''^tests/test_precompact\.py$''']
regexes = ['''insights=\[\("FACT", "The API uses token=[^"]+ for auth"\)\]''']
